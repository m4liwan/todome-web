<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ToDoMe – dein aktiver Arbeitstag-Coach für Selbstständige." />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <title>ToDoMe.</title>
    <!-- First frame already in the right colours (no white flash before the CSS loads). -->
    <style>
      /* Only <html> paints the page colour; overlay windows stay transparent. */
      html { background: #050505; color-scheme: dark; }
      body { margin: 0; background: transparent; }
      html.is-overlay, html.is-overlay body, html.is-companion, html.is-companion body { background: transparent !important; }
    </style>
    <script src="/boot.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
