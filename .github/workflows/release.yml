# Release for Windows, published as a draft on GitHub Releases.
# Signed as soon as the signing secrets exist; until then unsigned on
# purpose (TODOME_ALLOW_UNSIGNED, see electron-builder.release.cjs).
# Start: push a tag like v1.11.0 (git tag v1.11.0 && git push --tags).
# After the draft is checked, publish it on GitHub: from then on the
# installed apps find the update on their own.
# Staged rollout: before publishing, `node scripts/rollout.mjs <version> 10`
# offers the update to 10 % of the installations; raise it step by step
# (25, 50, 100). `... <version> 0` stops a bad update for everyone who has
# not installed it yet.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron, NSIS and 7-Zip come from GitHub downloads. Cached, a release
      # still builds while those servers answer 504 (seen on v1.15.2).
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      # Create the draft before electron-builder uploads: it uploads its files in
      # parallel, and with no release yet each upload created its own draft
      # (seen on v1.15.1: one draft with only the blockmap).
      - name: Prepare draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ vars.TODOME_RELEASE_OWNER }}/${{ vars.TODOME_RELEASE_REPO }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPO" --draft --title "${tag#v}" --notes ""
          fi
      - run: npm run release
        env:
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # No certificate yet: build unsigned. Signing secrets above take over once they are set.
          TODOME_ALLOW_UNSIGNED: 'true'
          TODOME_RELEASE_OWNER: ${{ vars.TODOME_RELEASE_OWNER }}
          TODOME_RELEASE_REPO: ${{ vars.TODOME_RELEASE_REPO }}
          # Fine-grained token with "Contents: read and write" on the release repo.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
